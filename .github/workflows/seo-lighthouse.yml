name: SEO Lighthouse baseline
on:
  pull_request:
    paths: ['app/**', '.github/workflows/seo-lighthouse.yml']
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/seo-lighthouse.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: seo-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    # Disable by repository variable if Actions quota needs to be conserved.
    if: vars.SEO_LHCI_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      SEO_MEASUREMENT_CONTEXT: github-ubuntu-mobile
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:seo-tools
      - run: npm run seo:lhci -- local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/artifacts/lighthouse/
          retention-days: 7
          if-no-files-found: warn

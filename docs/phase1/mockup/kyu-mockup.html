>\n<div style=\"display:flex;gap:34px;font-size:15px;align-items:center\"><span>About<\/span><span>Story<\/span>\n<span style=\"position:relative;color:#d6f48a;border-bottom:1px solid #d6f48a;padding-bottom:2px\">Freediving<ul style=\"position:absolute;top:100%;left:-16px;min-width:190px;margin:0;padding:8px 0;background:#10333b;border:1px solid #ffffff22;z-index:2\"><li style=\"list-style:none\"><span style=\"display:flex;align-items:center;min-height:44px;padding:0 20px;font-size:14px;color:#f4f4ec\">투어<\/span><\/li><li style=\"list-style:none\"><span style=\"display:flex;align-items:center;min-height:44px;padding:0 20px;font-size:14px;color:#f4f4ec\">장비<\/span><\/li><li style=\"list-style:none\"><span style=\"display:flex;align-items:center;min-height:44px;padding:0 20px;font-size:14px;color:#f4f4ec\">후기<\/span><\/li><li style=\"list-style:none\"><span style=\"display:flex;align-items:center;min-height:44px;padding:0 20px;font-size:14px;color:#d6f48a;font-weight:700\">여행 추천<span style=\"display:inline-block;background:#d6f48a;color:#071e29;font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 8px;margin-left:8px;vertical-align:middle\">NEW<\/span><\/span><\/li><\/ul><\/span><span>Films<\/span><\/div>\n<span style=\"font-size:15px;color:#d6f48a\">Contact<svg width=\"1em\" height=\"1em\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"vertical-align:-0.15em;margin-left:0.3em\"><path d=\"M7 7h10v10\"/><path d=\"M7 17 17 7\"/><\/svg><\/span><\/div><\/div><\/div><\/div>\n<\/div><\/div><\/section>\n\n<section style=\"background:#f4f4ec;color:#071e29;padding:72px 7% 80px\"><div style=\"max-width:1296px;margin:0 auto\">\n<h2 style=\"margin:0 0 8px;font-size:26px;font-weight:700;letter-spacing:-1px\">③ 결정할 것 9개<\/h2>\n<p style=\"margin:0 0 32px;font-size:14px;line-height:1.8;color:#52666a\">대부분 '제안대로'면 됩니다. 마음에 안 드는 것만 '다르게'에 적어 주세요. 위쪽 상단 버튼에서 '여행 추천 목록'·'여행 추천 상세'를 열어 보면 각 항목이 어디인지 확인할 수 있습니다.<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:20px\"><div style=\"border:1px solid #bdc8c3;background:#fff;padding:26px 28px;flex:1 1 380px;min-width:0;box-sizing:border-box\">\n<p style=\"margin:0;font-size:11px;font-weight:700;letter-spacing:1.5px;color:#267786\">T-1<\/p>\n<h3 style=\"margin:8px 0 10px;font-size:20px;font-weight:700;letter-spacing:-.5px;color:#071e29\">여행 추천은 메뉴 어디에 둘까요?<\/h3>\n<p style=\"margin:0 0 16px;font-size:14px;line-height:1.8;color:#52666a\">맨 위 메뉴에 새 칸을 만들지, Freediving 아래에 넣을지 정합니다.<\/p>\n<p style=\"margin:0 0 6px;font-size:13px;line-height:1.7;color:#071e29\"><b style=\"background:#d6f48a;padding:2px 8px;margin-right:8px\">제안<\/b>Freediving 아래(투어·장비·후기 다음). 맨 위 메뉴는 4개 그대로.<\/p>\n<p style=\"margin:0 0 14px;font-size:13px;line-height:1.7;color:#52666a\"><b style=\"border:1px solid #bdc8c3;padding:1px 8px;margin-right:8px\">다른 선택<\/b>맨 위 메뉴에 'Travel'을 새로 만든다(메뉴가 5개가 되어 좁은 화면이 답답해집니다).<\/p>\n<p style=\"margin:0;font-size:12px;color:#52666a\">시안에서 보기 → 위 ① 데스크톱·모바일 그림<\/p>\n<p style=\"margin:16px 0 0;font-size:13px;color:#071e29;border-top:1px dashed #bdc8c3;padding-top:12px\">답: ☐ 제안대로 &nbsp;&nbsp; ☐ 다르게 : ____________<\/p>\n<\/div><div style=\"border:1px solid #bdc8c3;background:#fff;padding:26px 28px;flex:1 1 380px;min-width:0;box-sizing:border-box\">\n<p style=\"margin:0;font-size:11px;font-weight:700;letter-spacing:1.5px;color:#267786\">T-2<\/p>\n<h3 style=\"margin:8px 0 10px;font-size:20px;font-weight:700;letter-spacing:-.5px;color:#071e29\">언제부터 메뉴에 보일까요?<\/h3>\n<p style=\"margin:0 0 16px;font-size:14px;line-height:1.8;color:#52666a\">글이 하나도 없는데 메뉴만 있으면 빈 화면으로 이어집니다.<\/p>\n<p style=\"margin:0 0 6px;font-size:13px;line-height:1.7;color:#071e29\"><b style=\"background:#d6f48a;padding:2px 8px;margin-right:8px\">제안<\/b>첫 여행 추천을 공개한 뒤부터 보입니다. 그전에는 메뉴·칩이 없습니다(Films와 같은 규칙).<\/p>\n<p style=\"margin:0 0 14px;font-size:13px;line-height:1.7;color:#52666a\"><b style=\"border:1px solid #bdc8c3;padding:1px 8px;margin-right:8px\">다른 선택<\/b>처음부터 보이게 하고 '곧 올립니다' 화면을 둔다.<\/p>\n<p style=\"margin:0;font-size:12px;color:#52666a\">시안에서 보기 → 위 ② 공개 전 / 공개 후<\/p>\n<p style=\"margin:16px 0 0;font-size:13px;color:#071e29;border-top:1px dashed #bdc8c3;padding-top:12px\">답: ☐ 제안대로 &nbsp;&nbsp; ☐ 다르게 : ____________<\/p>\n<\/div><div style=\"border:1px solid #bdc8c3;background:#fff;padding:26px 28px;flex:1 1 380px;min-width:0;box-sizing:border-box\">\n<p style=\"margin:0;font-size:11px;font-weight:700;letter-spacing:1.5px;color:#267786\">T-3<\/p>\n<h3 style=\"margin:8px 0 10px;font-size:20px;font-weight:700;letter-spacing:-.5px;color:#071e29\">목록은 어떻게 보일까요?<\/h3>\n<p style=\"margin:0 0 16px;font-size:14px;line-height:1.8;color:#52666a\">카드가 모여 있고, 지역·난이도로 걸러 볼 수 있습니다.<\/p>\n<p style=\"margin:0 0 6px;font-size:13px;line-height:1.7;color:#071e29\"><b style=\"background:#d6f48a;padding:2px 8px;margin-right:8px\">제안<\/b>카드 목록 + 지역·난이도 필터, 한 페이지 9건.<\/p>\n<p style=\"margin:0 0 14px;font-size:13px;line-height:1.7;color:#52666a\"><b style=\"border:1px solid #bdc8c3;padding:1px 8px;margin-right:8px\">다른 선택<\/b>필터 없이 단순 목록 / 지도로 보기(나중에 추가 가능).<\/p>\n<p style=\"margin:0;font-size:12px;color:#52666a\">시안에서 보기 → '여행 추천 목록' 화면<\/p>\n<p style=\"margin:16px 0 0;font-size:13px;color:#071e29;border-top:1px dashed #bdc8c3;padding-top:12px\">답: ☐ 제안대로 &nbsp;&nbsp; ☐ 다르게 : ____________<\/p>\n<\/div><div style=\"border:1px solid #bdc8c3;background:#fff;padding:26px 28px;flex:1 1 380px;min-width:0;box-sizing:border-box\">\n<p style=\"margin:0;font-size:11px;font-weight:700;letter-spacing:1.5px;color:#267786\">T-4<\/p>\n<h3 style=\"margin:8px 0 10px;font-size:20px;font-weight:700;letter-spacing:-.5px;color:#071e29\">사진을 쓸까요?<\/h3>\n<p style=\"margin:0 0 16px;font-size:14px;line-height:1.8;color:#52666a\">카드에 대표 사진을 넣을지입니다. 사진이 있으면 보기 좋지만 준비할 것이 늘어납니다.<\/p>\n<p style=\"margin:0 0 6px;font-size:13px;line-height:1.7;color:#071e29\"><b style=\"background:#d6f48a;padding:2px 8px;margin-right:8px\">제안<\/b>이번에는 쓰지 않습니다. 본문 안에는 사진을 넣을 수 있습니다.<\/p>\n<p style=\"margin:0 0 14px;font-size:13px;line-height:1.7;color:#52666a\"><b style=\"border:1px solid #bdc8c3;padding:1px 8px;margin-right:8px\">다른 선택<\/b>대표 사진 칸을 만들어 카드에 보이게 한다(어드민 입력 칸이 늘어납니다).<\/p>\n<p style=\"margin:0;font-size:12px;color:#52666a\">시안에서 보기 → '여행 추천 목록' 카드<\/p>\n<p style=\"margin:16px 0 0;font-size:13px;color:#071e29;border-top:1px dashed #bdc8c3;padding-top:12px\">답: ☐ 제안대로 &nbsp;&nbsp; ☐ 다르게 : ____________<\/p>\n<\/div><div style=\"border:1px solid #bdc8c3;background:#fff;padding:26px 28px;flex:1 1 380px;min-width:0;box-sizing:border-box\">\n<p style=\"margin:0;font-size:11px;font-weight:700;letter-spacing:1.5px;color:#267786\">T-5<\/p>\n<h3 style=\"margin:8px 0 10px;font-size:20px;font-weight:700;letter-spacing:-.5px;color:#071e29\">오래된 정보는 어떻게 알릴까요?<\/h3>\n<p style=\"margin:0 0 16px;font-size:14px;line-height:1.8;color:#52666a\">시기·예산은 바뀔 수 있어서 확인한 날짜를 보여 줍니다.<\/p>\n<p style=\"margin:0 0 6px;font-size:13px;line-height:1.7;color:#071e29\"><b style=\"background:#d6f48a;padding:2px 8px;margin-right:8px\">제안<\/b>확인일이 12개월 넘으면 '오래되었습니다' 글자 표시. 날짜가 없으면 '적혀 있지 않습니다'.<\/p>\n<p style=\"margin:0 0 14px;font-size:13px;line-height:1.7;color:#52666a\"><b style=\"border:1px solid #bdc8c3;padding:1px 8px;margin-right:8px\">다른 선택<\/b>6개월 / 24개월 기준, 또는 표시하지 않는다.<\/p>\n<p style=\"margin:0;font-size:12px;color:#52666a\">시안에서 보기 → 카드의 갈색 문구, 상세의 경고 띠<\/p>\n<p style=\"margin:16px 0 0;font-size:13px;color:#071e29;border-top:1px dashed #bdc8c3;padding-top:12px\">답: ☐ 제안대로 &nbsp;&nbsp; ☐ 다르게 : ____________<\/p>\n<\/div><div style=\"border:1px solid #bdc8c3;background:#fff;padding:26px 28px;flex:1 1 380px;min-width:0;box-sizing:border-box\">\n<p style=\"margin:0;font-size:11px;font-weight:700;letter-spacing:1.5px;color:#267786\">T-6<\/p>\n<h3 style=\"margin:8px 0 10px;font-size:20px;font-weight:700;letter-spacing:-.5px;color:#071e29\">맨 위 문구는 이대로 괜찮을까요?<\/h3>\n<p style=\"margin:0 0 16px;font-size:14px;line-height:1.8;color:#52666a\">제가 새로 쓴 문구입니다. 사이트 설정에서 언제든 고칠 수 있습니다.<\/p>\n<p style=\"margin:0 0 6px;font-size:13px;line-height:1.7;color:#071e29\"><b style=\"background:#d6f48a;padding:2px 8px;margin-right:8px\">제안<\/b>제목 '바다를 만나러 가는 길.' / 부제 '프리다이빙하기 좋은 곳과, 가기 전에 알아 둘 것을 정리했습니다.'<\/p>\n<p style=\"margin:0 0 14px;font-size:13px;line-height:1.7;color:#52666a\"><b style=\"border:1px solid #bdc8c3;padding:1px 8px;margin-right:8px\">다른 선택<\/b>규강 님이 직접 쓴 문구로 바꾼다.<\/p>\n<p style=\"margin:0;font-size:12px;color:#52666a\">시안에서 보기 → '여행 추천 목록' 맨 위<\/p>\n<p style=\"margin:16px 0 0;font-size:13px;color:#071e29;border-top:1px dashed #bdc8c3;padding-top:12px\">답: ☐ 제안대로 &nbsp;&nbsp; ☐ 다르게 : ____________<\/p>\n<\/div><div style=\"border:1px solid #bdc8c3;background:#fff;padding:26px 28px;flex:1 1 380px;min-width:0;box-sizing:border-box\">\n<p style=\"margin:0;font-size:11px;font-weight:700;letter-spacing:1.5px;color:#267786\">T-7<\/p>\n<h3 style=\"margin:8px 0 10px;font-size:20px;font-weight:700;letter-spacing:-.5px;color:#071e29\">문의는 어떻게 받을까요?<\/h3>\n<p style=\"margin:0 0 16px;font-size:14px;line-height:1.8;color:#52666a\">글을 보고 궁금한 사람이 연락하는 방법입니다.<\/p>\n<p style=\"margin:0 0 6px;font-size:13px;line-height:1.7;color:#071e29\"><b style=\"background:#d6f48a;padding:2px 8px;margin-right:8px\">제안<\/b>상세 맨 아래 '메일로 문의하기' 버튼(메일 창이 열릴 뿐 서버에 저장하지 않음). 바로 예약하는 기능은 없습니다.<\/p>\n<p style=\"margin:0 0 14px;font-size:13px;line-height:1.7;color:#52666a\"><b style=\"border:1px solid #bdc8c3;padding:1px 8px;margin-right:8px\">다른 선택<\/b>투어 신청 폼처럼 사이트 안에서 접수한다(저장·알림이 생기므로 개인정보 문구가 늘어납니다).<\/p>\n<p style=\"margin:0;font-size:12px;color:#52666a\">시안에서 보기 → '여행 추천 상세' 맨 아래<\/p>\n<p style=\"margin:16px 0 0;font-size:13px;color:#071e29;border-top:1px dashed #bdc8c3;padding-top:12px\">답: ☐ 제안대로 &nbsp;&nbsp; ☐ 다르게 : ____________<\/p>\n<\/div><div style=\"border:1px solid #bdc8c3;background:#fff;padding:26px 28px;flex:1 1 380px;min-width:0;box-sizing:border-box\">\n<p style=\"margin:0;font-size:11px;font-weight:700;letter-spacing:1.5px;color:#267786\">T-8<\/p>\n<h3 style=\"margin:8px 0 10px;font-size:20px;font-weight:700;letter-spacing:-.5px;color:#071e29\">홈에도 보여 줄까요?<\/h3>\n<p style=\"margin:0 0 16px;font-size:14px;line-height:1.8;color:#52666a\">홈에 여행 추천 구역을 따로 만들지입니다.<\/p>\n<p style=\"margin:0 0 6px;font-size:13px;line-height:1.7;color:#071e29\"><b style=\"background:#d6f48a;padding:2px 8px;margin-right:8px\">제안<\/b>넣지 않습니다. 홈이 길어지는 것을 막고, Freediving 쪽 칩으로 충분합니다.<\/p>\n<p style=\"margin:0 0 14px;font-size:13px;line-height:1.7;color:#52666a\"><b style=\"border:1px solid #bdc8c3;padding:1px 8px;margin-right:8px\">다른 선택<\/b>홈에 최신 글 3개를 보여 준다.<\/p>\n<p style=\"margin:0;font-size:12px;color:#52666a\">시안에서 보기 → (없음 — 홈 시안 그대로)<\/p>\n<p style=\"margin:16px 0 0;font-size:13px;color:#071e29;border-top:1px dashed #bdc8c3;padding-top:12px\">답: ☐ 제안대로 &nbsp;&nbsp; ☐ 다르게 : ____________<\/p>\n<\/div><div style=\"border:1px solid #bdc8c3;background:#fff;padding:26px 28px;flex:1 1 380px;min-width:0;box-sizing:border-box\">\n<p style=\"margin:0;font-size:11px;font-weight:700;letter-spacing:1.5px;color:#267786\">T-9<\/p>\n<h3 style=\"margin:8px 0 10px;font-size:20px;font-weight:700;letter-spacing:-.5px;color:#071e29\">가격·제휴는 어떻게 할까요?<\/h3>\n<p style=\"margin:0 0 16px;font-size:14px;line-height:1.8;color:#52666a\">예산을 적을지, 광고·제휴 링크를 넣을지입니다.<\/p>\n<p style=\"margin:0 0 6px;font-size:13px;line-height:1.7;color:#071e29\"><b style=\"background:#d6f48a;padding:2px 8px;margin-right:8px\">제안<\/b>예산은 '참고' 문구와 함께 글자로만. 제휴 링크는 만들지 않습니다.<\/p>\n<p style=\"margin:0 0 14px;font-size:13px;line-height:1.7;color:#52666a\"><b style=\"border:1px solid #bdc8c3;padding:1px 8px;margin-right:8px\">다른 선택<\/b>예산 칸을 아예 빼거나, 제휴 링크를 허용한다(표시 의무 등 검토가 필요합니다).<\/p>\n<p style=\"margin:0;font-size:12px;color:#52666a\">시안에서 보기 → '여행 추천 상세' 정보 표<\/p>\n<p style=\"margin:16px 0 0;font-size:13px;color:#071e29;border-top:1px dashed #bdc8c3;padding-top:12px\">답: ☐ 제안대로 &nbsp;&nbsp; ☐ 다르게 : ____________<\/p>\n<\/div><\/div>\n<\/div><\/sec
